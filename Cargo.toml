[package]
name = "jenks_breaks"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Fast exact Fisher-Jenks natural breaks (1-D minimum-SSE partitioning) via SMAWK, with Python bindings"
license = "MIT"
repository = "https://github.com/odinokov/jenks-breaks-rust"
readme = "README.md"

[lib]
name = "jenks_breaks"
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
# abi3-py39: build a single forward-compatible wheel per platform (CPython >= 3.9).
pyo3 = { version = "0.29", features = ["abi3-py39"] }
numpy = "0.29"

[features]
# Enabled by maturin for the distributed extension; left off for `cargo test`/`bench`
# so the test binary links libpython normally instead of expecting a host interpreter.
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "jenks"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
